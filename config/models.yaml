models:

  model_1:
    enabled: true
    provider: "openai"
    model_id: "gpt-5.4-mini-2026-03-17"
    api_key_env: "OPENAI_API_KEY"
    # null sampling parameters mean:
    # use the provider/model native defaults.
    # They are intentionally not sent to the API.
    generation:
      temperature: null
      top_p: null
      seed: null
      max_output_tokens: 1500

  model_2:
    enabled: true
    provider: "gemini"
    model_id: "gemini-3.5-flash"
    api_key_env: "GEMINI_API_KEY"
    # null sampling parameters mean:
    # use the provider/model native defaults.
    # They are intentionally not sent to the API.
    generation:
      temperature: null
      top_p: null
      seed: null
      max_output_tokens: 1500

execution:
  timeout_seconds: 120
  max_retries: 2
  retry_invalid_json: false

  store:
    raw_response: true
    parsed_response: true
    request_metadata: true
    token_usage: true

  record:
    model_identifier: true
    provider: true
    execution_timestamp: true
    generation_parameters: true
